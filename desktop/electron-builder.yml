appId: com.projectweb.desktop
productName: Project Web Desktop
executableName: projectweb-desktop
directories:
  output: release
files:
  - src/**
  - package.json
asar: true
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
linux:
  target:
    - { target: AppImage, arch: x64 }
    - { target: deb, arch: x64 }
  icon: build/icon.png
  category: Office
  maintainer: Project Web <admin@po.local>
  synopsis: Herramientas de IA para el administrador de Project Web
  artifactName: projectweb-desktop-linux-x86_64.${ext}
# Nombres fijos (sin versión): se suben así a Ajustes → App de escritorio y se reemplazan al actualizar
appImage:
  artifactName: projectweb-desktop-linux-x86_64.AppImage
deb:
  artifactName: projectweb-desktop-linux-amd64.deb
