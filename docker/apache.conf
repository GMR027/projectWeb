<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    RewriteEngine On
    # Fotos y planos de usuarios: no se entregan como archivos estáticos; pasan por index.php,
    # que comprueba el permiso del proyecto (Classes\Media). Los PDF/imágenes públicas de
    # build/img (logos, carátulas) siguen sirviéndose directo.
    RewriteRule ^/uploads/ /index.php [L,QSA]
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Defensa en profundidad: en carpetas donde se guardan archivos de usuarios nunca se ejecuta PHP
    <DirectoryMatch "^/var/www/html/public/(uploads|exportaciones|build/img)">
        php_admin_flag engine off
        Options -ExecCGI
    </DirectoryMatch>
    # Si mod_rewrite fallara, /uploads sigue sin poder listarse ni descargarse directamente
    <Directory "^/var/www/html/public/uploads">
        Require all denied
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
