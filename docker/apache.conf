<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Defensa en profundidad: en carpetas donde se guardan archivos de usuarios nunca se ejecuta PHP
    <DirectoryMatch "^/var/www/html/public/(uploads|exportaciones|build/img)">
        php_admin_flag engine off
        Options -ExecCGI
    </DirectoryMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
