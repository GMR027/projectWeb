image:
  repository: gmr27/projectweb
  tag: latest
  pullPolicy: Always

host: projectweb.iguzman.com.mx
ingressClass: public
clusterIssuer: letsencrypt-prod
bodySize: 260m

# Los volúmenes hostpath viven en este nodo
nodeSelector:
  kubernetes.io/hostname: master

# Secret creado por deploy.sh (claves: DB_PASSWORD, MYSQL_ROOT_PASSWORD)
# Rangos desde los que se confía en X-Forwarded-For (pods del Ingress); sirve para el límite de mensajes por IP
trustedProxies: "10.1.0.0/16"

secretName: projectweb-db

app:
  timezone: America/Mazatlan
  contactEmail: ""
  storage: 45Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

mysql:
  image: mysql:8
  database: project
  user: project
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Antivirus para los archivos subidos (clamd en su propio pod; la app envía cada archivo por red antes de guardarlo)
clamav:
  enabled: true
  required: true      # si clamd no responde, se rechazan las subidas (falla cerrado)
  image: clamav/clamav:1.4
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 2Gi }
